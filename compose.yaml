services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong initial admin password outside source control}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 15000
      PORT: 3000
      TRUST_PROXY: "1"
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_ALLOWED_HOSTS: ${NOTIFY_ALLOWED_HOSTS:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN to your real domain}
    secrets:
      - data_encryption_key
    volumes:
      - site_data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_signatures:/var/lib/clamav
    expose:
      - "3310"
    mem_limit: 1536m
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your real domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
secrets:
  data_encryption_key:
    file: ${DATA_KEY_FILE:?Set DATA_KEY_FILE to a key file outside the data directory}
volumes:
  clamav_signatures:
  site_data:
  caddy_data:
  caddy_config:
